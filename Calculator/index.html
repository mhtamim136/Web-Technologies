<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    
    .container {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background: #303030;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
      padding: 2rem;
      width: 350px;
    }

    .display {
      width: 100%;
      height: 50px;
      font-size: 2rem;
      text-align: right;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      padding-right: 10px;
      background: #fff;
      color: #000;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .btn {
      font-size: 1.6rem;
      padding: 20px;
      background: #ededed;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-red {
      background: #eb4747;
      color: #fff;
      grid-column: span 2;
    }

    .btn-orange {
      background: #ffaa13;
      color: #fff;
    }

    .btn-green {
      background: #43b97e;
      color: #fff;
      grid-column: span 2;
    }

    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="calculator">
      <input type="text" class="display" id="display" placeholder="0" readonly aria-label="Calculator display">
      <div class="buttons">
        <button class="btn btn-red" data-action="clear">C</button>
        <button class="btn btn-orange" data-value="/">÷</button>
        <button class="btn btn-orange" data-value="*">×</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn btn-orange" data-value="-">−</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn btn-orange" data-value="+">+</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>

        <button class="btn btn-green" data-action="calculate">=</button>
        <button class="btn btn-zero" data-value="0">0</button>

        <button class="btn" data-value=".">.</button>
      </div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelector('.buttons');
    let currentInput = "";
    let resultShown = false;

    buttons.addEventListener('click', (e) => {
      const btn = e.target;

      if (!btn.classList.contains('btn')) return;

      if (btn.dataset.value !== undefined) {
        
        if (resultShown && !['+', '-', '*', '/', '.'].includes(btn.dataset.value)) {
          currentInput = btn.dataset.value;
          resultShown = false;
        } else {
         
          if (resultShown) {
            resultShown = false;
          }
          currentInput += btn.dataset.value;
        }
        display.value = currentInput || '0';
      }
      else if (btn.dataset.action === 'clear') {
        currentInput = "";
        display.value = '0';
        resultShown = false;
      }
      else if (btn.dataset.action === 'calculate') {
        if (currentInput.trim() === '') return;
        try {
          const result = eval(currentInput);
          display.value = result;
          currentInput = result.toString();
          resultShown = true;
        } catch (error) {
          display.value = "Error";
          currentInput = "";
          resultShown = false;
        }
      }
    });
  </script>
</body>
</html>
